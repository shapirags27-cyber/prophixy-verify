<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Prophixy Verification</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <img src="/images/prophixy-logo.png" class="logo">

    <h1>Prophixy Verification</h1>

    <p id="discordStatus" class="subtitle">
      Checking Discord login...
    </p>

    <p id="username"></p>

    <button id="connectButton">
      🔗 Connect MetaMask
    </button>

    <div id="status">
      Connect your MetaMask wallet to verify your Prophixy SBT.
    </div>

    <div class="footer">
      Shape Africa's Future
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6/dist/ethers.umd.min.js"></script>

  <script>

    const params =
      new URLSearchParams(window.location.search);

    const discordId =
      params.get("discordId");

    const username =
      params.get("username");

    const status =
      document.getElementById("status");

    const usernameElement =
      document.getElementById("username");

    const discordStatus =
      document.getElementById("discordStatus");

    const connectButton =
      document.getElementById("connectButton");


    // ==========================================
    // CHECK DISCORD LOGIN
    // ==========================================

    async function checkDiscordSession() {

      try {

        const response =
          await fetch("/session", {
            credentials: "include"
          });

        const data =
          await response.json();

        if (!data.loggedIn) {

          discordStatus.textContent =
            "Discord login required.";

          connectButton.disabled = true;

          status.textContent =
            "Please login with Discord first.";

          return false;
        }

        discordStatus.textContent =
          "✅ Discord connected";

        usernameElement.textContent =
          "Discord: " +
          (data.username || username || data.discordId);

        return true;

      } catch (error) {

        console.error(
          "Discord session check failed:",
          error
        );

        discordStatus.textContent =
          "Could not check Discord login.";

        connectButton.disabled = true;

        return false;
      }
    }


    // ==========================================
    // CONNECT METAMASK
    // ==========================================

    async function connectMetaMask() {

      if (!window.ethereum) {

        status.textContent =
          "❌ MetaMask was not detected.";

        alert(
          "Please install or open MetaMask to continue."
        );

        return;
      }

      try {

        connectButton.disabled = true;

        status.textContent =
          "Opening MetaMask...";

        // Request wallet connection
        const provider =
          new ethers.BrowserProvider(
            window.ethereum
          );

        await provider.send(
          "eth_requestAccounts",
          []
        );


        // ======================================
        // CHECK NETWORK
        // ======================================

        const network =
          await provider.getNetwork();

        const chainId =
          Number(network.chainId);

        // Sepolia = 11155111
        if (chainId !== 11155111) {

          status.textContent =
            "Switching MetaMask to Sepolia...";

          try {

            await window.ethereum.request({
              method: "wallet_switchEthereumChain",
              params: [
                {
                  chainId: "0xaa36a7"
                }
              ]
            });

          } catch (switchError) {

            console.error(
              "Network switch error:",
              switchError
            );

            status.textContent =
              "❌ Please switch MetaMask to Sepolia.";

            alert(
              "Please switch your MetaMask network to Sepolia and try again."
            );

            connectButton.disabled = false;

            return;
          }
        }


        // ======================================
        // GET WALLET ADDRESS
        // ======================================

        const signer =
          await provider.getSigner();

        const wallet =
          await signer.getAddress();

        console.log(
          "Connected MetaMask wallet:",
          wallet
        );


        // ======================================
        // VERIFY SBT
        // ======================================

        status.textContent =
          "🔎 Checking your Prophixy SBT on Sepolia...";

        const response =
          await fetch(
            `/verify/${encodeURIComponent(wallet)}?discordId=${encodeURIComponent(discordId || "")}`,
            {
              credentials: "include"
            }
          );

        const data =
          await response.json();

        console.log(
          "Verification result:",
          data
        );


        // ======================================
        // SUCCESS
        // ======================================

        if (
          data.success &&
          data.minted
        ) {

          status.textContent =
            `✅ Verified! Role: ${data.role}`;

          alert(
            `Verification successful!\n\nSBT Role: ${data.role}`
          );

          return;
        }


        // ======================================
        // NO SBT
        // ======================================

        if (
          data.success &&
          !data.minted
        ) {

          status.textContent =
            "❌ This wallet does not have a Prophixy SBT.";

          alert(
            "This wallet does not have a Prophixy SBT."
          );

          return;
        }


        // ======================================
        // ERROR
        // ======================================

        status.textContent =
          data.message ||
          "❌ Verification failed.";

        alert(
          data.message ||
          "Verification failed."
        );

      } catch (error) {

        console.error(
          "MetaMask verification error:",
          error
        );

        status.textContent =
          "❌ Wallet verification failed.";

        alert(
          error.message ||
          "Could not complete wallet verification."
        );

      } finally {

        connectButton.disabled = false;

      }
    }


    // ==========================================
    // PAGE START
    // ==========================================

    document.addEventListener(
      "DOMContentLoaded",
      async () => {

        const loggedIn =
          await checkDiscordSession();

        if (!loggedIn) {
          return;
        }

        connectButton.addEventListener(
          "click",
          connectMetaMask
        );

      }
    );

  </script>

</body>
</html>
